# The website trial (pipeline/trial.py): every hour, publish whatever of 2026's Rounds 1-2 should be
# visible by now to the trial's own Supabase project. Rounds open at 9am Sydney (22:00 UTC), final team
# lists come an hour before kickoff and closing prices 30 minutes before, so :35 past the hour lands
# them before the game starts, with room for GitHub's late starts.
#
# Secret: TRIAL_DB_URL, the trial project's session pooler string. Without it the job does nothing.
# Nothing is committed. Once the trial is over the runs publish nothing new; turn the workflow off
# (Actions > trial > ... > Disable workflow).
name: trial

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      history:
        description: Also publish 2021-2025 and Elo since 2009 (the first time)
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: trial
      cancel-in-progress: false
    env:
      TRIAL_DB_URL: ${{ secrets.TRIAL_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.TRIAL_DB_URL != ''

      - uses: actions/setup-python@v5
        if: env.TRIAL_DB_URL != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        if: env.TRIAL_DB_URL != ''
        run: pip install -r requirements.txt

      - name: Publish
        if: env.TRIAL_DB_URL != ''
        run: python pipeline/trial.py publish ${{ inputs.history && '--history' || '' }}
