# One job of the weekly pipeline (pipeline/run.py), called by results.yml, predict.yml, refresh.yml
# and odds.yml (PLAN_WEB.md §1.1, step 8). It runs the job, commits what it recorded, and alerts if
# the job failed. After a job that didn't fail, publish.py copies the season's records into the
# Supabase database (step 7).
#
# Secrets (Settings > Secrets and variables > Actions):
#   ODDS_API_KEY       The Odds API key (fetch_odds.py); without it the odds fetch is skipped
#   SUPABASE_DB_URL    the database's session pooler connection string (publish.py); without it
#                      nothing is published
#   ALERT_WEBHOOK_URL  optional Discord or Slack webhook for failure alerts (GitHub also emails)
name: pipeline job

on:
  workflow_call:
    inputs:
      job:
        description: results, predict, refresh or odds
        required: true
        type: string
      fail:
        description: fail on purpose, to test the alert
        required: false
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # to commit the records
    # One pipeline job at a time: they all commit to the same records. Queued, never cancelled.
    concurrency:
      group: pipeline
      cancel-in-progress: false
    env:
      JOB: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Season
        id: season
        run: |
          season=$(python -c 'import sys; sys.path.insert(0, "src"); import config; print(config.PREDICT_SEASON)')
          echo "season=$season" >> "$GITHUB_OUTPUT"
          echo "RUNS=data/pipeline/live/$season/runs.jsonl" >> "$GITHUB_ENV"

      # data/raw/ isn't committed. Keep the season's scraped match pages between runs so the results
      # job only fetches new games (PLAN_WEB.md note 1). Each results run saves a new copy; the
      # newest one is restored.
      - name: Restore the season's raw pages
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/nrl/${{ steps.season.outputs.season }}
            data/raw/origin/${{ steps.season.outputs.season }}
          key: raw-${{ steps.season.outputs.season }}-${{ github.run_id }}
          restore-keys: raw-${{ steps.season.outputs.season }}-

      - name: Run the ${{ inputs.job }} job
        id: run
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FAIL: ${{ inputs.fail && '--fail' || '' }}
        run: python pipeline/run.py --job "$JOB" $FAIL

      # Every run publishes, even one with nothing to do: that also keeps the free database from
      # pausing in the off-season. A failure here fails the workflow and alerts.
      - name: Publish to the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: python pipeline/publish.py

      - name: Save the season's raw pages
        if: always() && inputs.job == 'results'
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/nrl/${{ steps.season.outputs.season }}
            data/raw/origin/${{ steps.season.outputs.season }}
          key: raw-${{ steps.season.outputs.season }}-${{ github.run_id }}

      # The run log, predictions, graded season and odds snapshots (data/pipeline/live/), the
      # results job's updated tables (data/processed/) and every team list fetched. A run that only
      # logged "nothing to do" isn't committed, except the weekly results run, which also keeps the
      # schedule alive (GitHub turns scheduled workflows off after 60 days without a commit).
      - name: Commit the records
        if: always() && steps.season.outcome == 'success'
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          for path in data/pipeline/live data/processed; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          # data/raw/ is ignored; the team lists fetched are small and worth keeping (every version).
          if [ -e data/raw/teamlists_live ]; then git add -f data/raw/teamlists_live; fi
          changed=$(git diff --cached --name-only)
          if [ -z "$changed" ]; then echo "nothing to commit"; exit 0; fi
          if [ "$OUTCOME" = success ] && [ "$JOB" != results ] && ! echo "$changed" | grep -qv 'runs\.jsonl$'; then
            echo "only a 'nothing to do' entry in the run log: not committed"; exit 0
          fi
          status=$(tail -n 1 "$RUNS" | jq -r '.status // empty')
          git commit -q -m "pipeline: $JOB (${status:-$OUTCOME})"
          for attempt in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((attempt * 10))
          done
          echo "push failed"; exit 1

      - name: Alert
        if: failure()
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          note=$(tail -n 1 "$RUNS" 2>/dev/null | jq -r 'select(.status == "failed") | .notes')
          msg="NRL pipeline: the $JOB workflow failed${note:+: $note}. $URL"
          echo "::error::$msg"
          if [ -n "$WEBHOOK" ]; then
            curl -fsS -H "Content-Type: application/json" -d "$(jq -n --arg m "$msg" '{content: $m, text: $m}')" "$WEBHOOK"
          fi
